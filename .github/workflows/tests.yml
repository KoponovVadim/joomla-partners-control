name: tests

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CREDENTIAL_ENCRYPTION_KEY: github-actions-test-key
      SECRET_KEY: ci-only-Django-secret-key-9f4C7z1N6q8W2m5R0x3V7b1K
      DEBUG: "0"
      ALLOWED_HOSTS: testserver,localhost
      CSRF_TRUSTED_ORIGINS: https://testserver
      PUBLIC_BASE_URL: https://testserver
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check shell scripts
        run: sh -n scripts/deploy.sh scripts/entrypoint.sh
      - name: Check Joomla connector PHP
        run: |
          php -l joomla_connector/plg_ajax_jpcconnector/jpcconnector.php
          php -l joomla_connector/plg_ajax_jpcconnector/script.php
      - name: Build Joomla connector package
        run: |
          python scripts/build_joomla_connector.py
          git diff --exit-code -- static/partners/downloads/plg_ajax_jpcconnector-1.0.0.zip
      - name: Django system check
        run: python manage.py check
      - name: Django deployment check
        env:
          SECURE_SSL_REDIRECT: "1"
        run: python manage.py check --deploy
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test
      - name: Upload Joomla 3 connector
        uses: actions/upload-artifact@v4
        with:
          name: plg_ajax_jpcconnector-1.0.0
          path: static/partners/downloads/plg_ajax_jpcconnector-1.0.0.zip
          if-no-files-found: error
